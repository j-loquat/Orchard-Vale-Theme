name: Validate theme kit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML, CSS, JS, images, contrast, and local references
        run: npm run validate
      - name: Check HTML image hints
        run: npm run optimize:images:check
